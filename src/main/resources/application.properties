spring.application.name=multi-currency-account-api

spring.datasource.url=jdbc:h2:mem:bankdb
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

exchange.rates.EUR=1.0
exchange.rates.USD=1.12
exchange.rates.SEK=11.25
exchange.rates.GBP=0.85

external.logging.url=https://httpbin.org/status/200
external.logging.connect-timeout=2s
external.logging.read-timeout=3s

idempotency.retention=24h
idempotency.cleanup-cron=0 0 * * * *
